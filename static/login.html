<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceso · VideoMCP Studio</title>
<style>
:root{--jade:#21c58e;--text:#f5fbfa;--muted:#91abb0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#06171d,#0d3034);color:var(--text)}
.card{width:min(420px,92vw);background:#0e2932;border:1px solid #25464d;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0005}
h1{margin:0 0 6px}.muted{color:var(--muted)}input{width:100%;background:#071c23;border:1px solid #31515a;border-radius:12px;padding:13px;color:white;margin:8px 0 14px}
button{width:100%;background:var(--jade);border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer}.error{color:#ff9f9f;margin-top:12px;min-height:20px}
</style>
</head>
<body>
<form class="card" id="login">
<h1>VideoMCP Studio</h1>
<p class="muted">Acceso privado</p>
<label>Correo</label>
<input id="email" type="email" value="marugaul@gmail.com" autocomplete="username" required>
<label>Clave</label>
<input id="password" type="password" autocomplete="current-password" required>
<button>Entrar</button>
<div class="error" id="error"></div>
</form>
<script>
document.getElementById('login').addEventListener('submit',async e=>{
 e.preventDefault();
 const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
 if(r.ok){location.href='/';return}
 document.getElementById('error').textContent='Correo o clave incorrectos';
});
</script>
</body>
</html>

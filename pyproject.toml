[project]
name = "videomcp-studio"
version = "0.1.0"
description = "Local-first video studio with FFmpeg, asset search, ComfyUI and MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pydantic>=2.9",
  "mcp[cli]>=2,<3"
]

[project.scripts]
videomcp-web = "videomcp.app:main"
videomcp-mcp = "videomcp.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videomcp"]

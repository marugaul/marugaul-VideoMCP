[project]
name = "videomcp-studio"
version = "0.2.0"
description = "Local-first Video Studio: MCP + Kinocut/FFmpeg + ComfyUI/Wan"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pydantic>=2.9",
  "mcp[cli]>=2,<3",
  "kinocut>=1.16.5,<2"
]

[project.scripts]
videomcp-web = "videomcp.app:main"
videomcp-mcp = "videomcp.mcp_server:main"
videomcp-doctor = "videomcp.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videomcp"]
